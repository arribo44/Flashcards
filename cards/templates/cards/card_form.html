<!-- cards/templates/cards/card_form.html -->

{% extends "cards/base.html" %}

{% block content %}
    {% if card %}
        <h2>✏️ Modifier la carte</h2>
    {% else %}
        <h2>✨ Nouvelle carte</h2>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Enregistrer">
    </form>
    <a href="{% url 'card-list' deck.pk %}">
        Annuler
    </a>
{% endblock %}
