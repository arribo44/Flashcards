<!-- cards/templates/cards/card_check_form.html -->

<form method="post" data-solved="{{ solved | yesno:'true,false' }}">
    {% csrf_token %}
    <input type="hidden" name="card_id" value="{{ card.id }}">
    <input type="hidden" name="solved" value="{{ solved }}">
    {% if solved %}
        <button type="submit" class="btn btn-success btn-lg w-100"><i class="bi bi-check-lg me-1"></i> Je sais</button>
    {% else %}
        <button type="submit" class="btn btn-danger btn-lg w-100"><i class="bi bi-x-lg me-1"></i> Je ne sais pas</button>
    {% endif %}
</form>
