<!-- cards/templates/box_links.html -->

{% load humanize %}

{% for box in boxes %}
    <a href="{% url 'box' deck_pk=deck.pk box_num=box.number %}"
       title="{{ box.due_count }} due today / {{ box.card_count }} in box">
        🗃 {{ box.number | ordinal }} Box <mark>{{ box.due_count }}</mark>/{{ box.card_count }}
    </a>
{% endfor %}
