<!-- cards/templates/box_links.html -->

{% for box in boxes %}
    <a href="{% url 'box' deck_pk=deck.pk box_num=box.number %}"
       title="{{ box.due_count }} à réviser aujourd'hui / {{ box.card_count }} dans la boîte">
        🗃 Boîte {{ box.number }} <mark>{{ box.due_count }}</mark>/{{ box.card_count }}
    </a>
{% endfor %}
