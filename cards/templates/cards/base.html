<!-- cards/templates/cards/base.html -->

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flashcards</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">

    <style>
        /* Custom CSS */

        :root {
            --accent: #6e48ad;
            --accent-bg: white;
            --bg: #fff;
            --text: #212121;
            --text-light: #585858;
            --border: #d8dae1;
            --code: #d81b60;
            --preformatted: #444;
        }

        article {
            background-color: var(--marked);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 1em;
            margin: 1em 0;
        }

        h2 {
            text-align: center;
        }

        h2, h4 {
            margin-top: 0;
        }

        hr {
            background: var(--accent);
            border-color: var(--accent);
        }

        button,
        a[role="button"] {
            color: black;
            text-decoration: none;
        }

        input, select, textarea {
            width: 100%;
        }

        nav form.logout {
            display: inline;
        }

        nav form.logout button {
            margin: 0;
        }

        .answer-buttons {
            display: flex;
            gap: 1em;
        }

        .answer-buttons form {
            flex: 1;
        }

        .shortcuts {
            color: var(--text-light);
        }

        /* Keyboard hints are useless on touch screens */
        @media (hover: none) {
            .shortcuts {
                display: none;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Flashcards</h1>
        {% include "cards/navigation.html" %}
    </header>


    <main>
        {% for message in messages %}
            <p class="notice">{{ message }}</p>
        {% endfor %}
        {% block content %}
            <h2>Bienvenue dans vos flashcards !</h2>
        {% endblock content %}
    </main>
</body>

</html>
