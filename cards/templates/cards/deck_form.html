<!-- cards/templates/cards/deck_form.html -->

{% extends "cards/base.html" %}

{% block content %}
    {% if deck %}
        <h2>✏️ Modifier le paquet</h2>
    {% else %}
        <h2>✨ Nouveau paquet</h2>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Enregistrer">
    </form>
    <a href="{% url 'deck-list' %}">
        Annuler
    </a>
    {% if deck %}
        <hr>
        <a href="{% url 'deck-delete' deck.pk %}" role="button">
            🗑 Supprimer ce paquet
        </a>
    {% endif %}
{% endblock %}
