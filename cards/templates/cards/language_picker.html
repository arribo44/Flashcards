<!-- cards/templates/cards/language_picker.html -->

{% load i18n %}
{% get_current_language as current %}
{# A switch between the two interface languages (settings.LANGUAGES): one click flips it #}
<form method="post" action="{% url 'set_language' %}" class="d-flex {{ class }}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" name="language" value="{% if current == 'en' %}fr{% else %}en{% endif %}"
            class="language-switch" role="switch" aria-checked="{% if current == 'en' %}true{% else %}false{% endif %}"
            aria-label="English" title="{% if current == 'en' %}Passer en français{% else %}Switch to English{% endif %}">
        {% include "cards/flag.html" with code="fr" label="" class="language-switch-fr" %}
        <span class="language-switch-track" aria-hidden="true"><span class="language-switch-knob"></span></span>
        {% include "cards/flag.html" with code="gb" label="" class="language-switch-en" %}
    </button>
</form>
