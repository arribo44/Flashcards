<!-- cards/templates/cards/navigation.html -->

{% load cards_tags %}

<nav>
    {% if user.is_authenticated %}
        <a href="{% url 'deck-list' %}">📚 Mes paquets</a>
        <a href="{% url 'stats' %}">📊 Statistiques</a>
        {% if deck.pk %}
            <a href="{% url 'card-list' deck.pk %}">🗂 {{ deck.name }}</a>
            <a href="{% url 'study' deck.pk %}">🎯 Réviser</a>
            {% boxes_as_links deck %}
        {% endif %}
        <form method="post" action="{% url 'logout' %}" class="logout">
            {% csrf_token %}
            <button type="submit">Se déconnecter ({{ user.username }})</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">Se connecter</a>
        <a href="{% url 'signup' %}">Créer un compte</a>
    {% endif %}
</nav>
