<!-- cards/templates/registration/login.html -->

{% extends "cards/base.html" %}

{% block content %}
    <h2>Connexion</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <input type="submit" value="Se connecter">
    </form>
    <p>Pas encore de compte ? <a href="{% url 'signup' %}">Créer un compte</a></p>
{% endblock %}
