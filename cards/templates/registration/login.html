<!-- cards/templates/registration/login.html -->

{% extends "cards/base.html" %}

{% block content %}
    <h2>Log in</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <input type="submit" value="Log in">
    </form>
    <p>No account yet? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
