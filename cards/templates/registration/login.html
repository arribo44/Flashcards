<!-- cards/templates/registration/login.html -->

{% extends "registration/auth_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Connexion{% endblock %}

{% block content %}
    <p class="login-box-msg">Connectez-vous pour réviser vos cartes</p>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="d-grid">
            <button type="submit" class="btn btn-primary"><i class="bi bi-box-arrow-in-right me-1"></i> Se connecter</button>
        </div>
    </form>
    <p class="mb-0 mt-3 text-center">
        Pas encore de compte ? <a href="{% url 'signup' %}">Créer un compte</a>
    </p>
{% endblock %}
