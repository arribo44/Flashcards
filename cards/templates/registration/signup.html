<!-- cards/templates/registration/signup.html -->

{% extends "cards/base.html" %}

{% block content %}
    <h2>Créer un compte</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Créer mon compte">
    </form>
    <p>Déjà un compte ? <a href="{% url 'login' %}">Se connecter</a></p>
{% endblock %}
