<!-- cards/templates/registration/signup.html -->

{% extends "registration/auth_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Créer un compte{% endblock %}

{% block content %}
    <p class="login-box-msg">Créez votre compte pour commencer</p>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-grid">
            <button type="submit" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i> Créer mon compte</button>
        </div>
    </form>
    <p class="mb-0 mt-3 text-center">
        Déjà un compte ? <a href="{% url 'login' %}">Se connecter</a>
    </p>
{% endblock %}
